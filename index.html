                            c.messages.push(finalMsg);
                        }
                        delete c.messages.__partial;
                        saveChats();
                    }

                    if (c && c.messages && c.messages.length === 2 && !c.renamedAt) {
                        c.title = (text || chatTitle).slice(0, 40);
                        renderHistory();
                    }

                } catch (err) {
                    if (livePump) { clearInterval(livePump); livePump = null; }
                    if (proseEl) proseEl.classList.remove('streaming-prose');
                    if (loading.parentNode) loading.remove();
                    let errorMsg = err.message || t('errGeneric');
                    if (err && (err.name === 'TypeError' || /Failed to fetch/i.test(err.message || ''))) {
                        errorMsg = t('errNetwork');
                    }
                    if (err && /auth|sign.?in|unauthor|login/i.test(err.message || '')) {
                        errorMsg = t('errAuth');
                    }
                    if (err.name === 'AbortError') {
                        errorMsg = t('errAbort');
                    }
                    const finalErrorMsg = `⚠️ ${errorMsg}`;
                    addMessage('assistant', finalErrorMsg, selected ? selected.name : '', true);
                    if (c && c.messages) {
                        const pIdx = c.messages.__partial;
                        if (typeof pIdx === 'number' && c.messages[pIdx] && c.messages[pIdx].text) {
                            delete c.messages[pIdx].partial;
                            delete c.messages.__partial;
                        } else if (typeof pIdx === 'number') {
                            c.messages.splice(pIdx, 1);
                            delete c.messages.__partial;
                        }
                        c.messages.push({ role: 'assistant', text: finalErrorMsg, model: selected ? selected.name : '',
                            isError: true });
                        saveChats();
                    }
                    toast(errorMsg, true);
                } finally {
                    if (livePump) { clearInterval(livePump); livePump = null; }
                    if (requestTimeout) clearTimeout(requestTimeout);
                    isProcessing = false;
                    isAssistantResponding = false;
                    abortController = null;
                    const sendBtn2 = $('mainSendBtn');
                    const stopBtn2 = $('stopBtn');
                    if (sendBtn2) { sendBtn2.disabled = false; sendBtn2.style.display = 'flex'; }
                    if (stopBtn2) stopBtn2.style.display = 'none';
                    const promptEl2 = $('mainInput');
                    if (promptEl2) promptEl2.focus();
                }
            }

            function closeDrawer() {
                const drawer = $('sidebar');
                const shade = $('sidebarOverlay');
                if (drawer) drawer.classList.remove('open');
                if (shade) shade.classList.remove('open');
            }

            function closeSettings() {
                const overlay = $('settingsOverlay');
                if (overlay) overlay.classList.remove('open');
            }

            function openSettings() {
                const overlay = $('settingsOverlay');
                if (overlay) overlay.classList.add('open');
                const closeButton = $('settingsClose');
                if (closeButton) closeButton.focus();
            }

            const settingsTriggerBtn = $('settingsTrigger');
            if (settingsTriggerBtn) {
                settingsTriggerBtn.onclick = function(e) {
                    e.stopPropagation();
                    if (window.innerWidth <= 768) closeDrawer();
                    openSettings();
                };
            }
            const settingsCloseBtn = $('settingsClose');
            if (settingsCloseBtn) settingsCloseBtn.onclick = closeSettings;
            const settingsOverlayEl = $('settingsOverlay');
            if (settingsOverlayEl) {
                settingsOverlayEl.addEventListener('click', function(e) {
                    if (e.target === settingsOverlayEl) closeSettings();
                });
            }

            const chatActionCloseBtn = $('chatActionClose');
            if (chatActionCloseBtn) chatActionCloseBtn.onclick = closeChatActionModal;
            const chatActionOverlayEl = $('chatActionOverlay');
            if (chatActionOverlayEl) {
                chatActionOverlayEl.addEventListener('click', function (e) {
                    if (e.target === chatActionOverlayEl) closeChatActionModal();
                });
            }
            const chatRenameSaveBtn = $('chatRenameSaveBtn');
            const chatRenameInputEl = $('chatRenameInput');
            if (chatRenameSaveBtn) {
                chatRenameSaveBtn.onclick = function () {
                    if (!actionChatId || !chatRenameInputEl) return;
                    if (renameChatById(actionChatId, chatRenameInputEl.value)) {
                        closeChatActionModal();
                    }
                };
            }
            if (chatRenameInputEl) {
                chatRenameInputEl.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (actionChatId && renameChatById(actionChatId, chatRenameInputEl.value)) {
                            closeChatActionModal();
                        }
                    }
                });
            }
            const chatDeleteOneBtn = $('chatDeleteOneBtn');
            if (chatDeleteOneBtn) {
                chatDeleteOneBtn.onclick = function () {
                    if (!actionChatId) return;
                    const idToDelete = actionChatId;
                    closeChatActionModal();
                    deleteChatById(idToDelete);
                };
            }

            const openDrawerBtn = $('mobileBurger');
            if (openDrawerBtn) {
                openDrawerBtn.onclick = function() {
                    const drawer = $('sidebar');
                    const shade = $('sidebarOverlay');
                    if (drawer) drawer.classList.add('open');
                    if (shade) shade.classList.add('open');
                };
            }

            const closeDrawerBtn = $('sidebarOverlay');
            if (closeDrawerBtn) closeDrawerBtn.onclick = function() {
                const drawer = $('sidebar');
                const shade = $('sidebarOverlay');
                if (drawer) drawer.classList.remove('open');
                if (shade) shade.classList.remove('open');
            };

            const newChatBtn = $('newChatBtn');
            if (newChatBtn) newChatBtn.onclick = newChat;

            const clearHistoryBtn = $('clearAllChatsBtn');
            if (clearHistoryBtn) {
                clearHistoryBtn.onclick = function() {
                    if (!chats || !chats.length) {
                        const storedNow = readStoredChats();
                        if (!storedNow.length) {
                            toast(t('nothingToClear'));
                            return;
                        }
                    }
                    chats = [];
                    clearedSeen = Date.now();
                    try {
                        localStorage.setItem(STORE_CLEARED, String(clearedSeen));
                        localStorage.setItem(STORE_CHATS, '[]');
                        localStorage.removeItem(LEGACY_KEYS.chats);
                    } catch (e) {}
                    newChat();
                    saveChats();
                    toast(t('cleared'));
                    closeSettings();
                };
            }

            const sendBtn = $('mainSendBtn');
            if (sendBtn) sendBtn.onclick = send;

            const stopGenerationBtn = $('stopBtn');
            if (stopGenerationBtn) {
                stopGenerationBtn.onclick = function () {
                    if (abortController) {
                        abortController.abort();
                        abortController = null;
                    }
                    isProcessing = false;
                    isAssistantResponding = false;
                    const sBtn = $('mainSendBtn');
                    if (sBtn) { sBtn.disabled = false; sBtn.style.display = 'flex'; }
                    stopGenerationBtn.style.display = 'none';
                    toast(t('stopping'));
                };
            }

            const plusThinkItem = $('plusThinkBtn');
            if (plusThinkItem) plusThinkItem.onclick = function (e) {
                e.stopPropagation();
                setThinking(!thinkingOn);
            };
            const plusSearchItem = $('plusSearchBtn');
            if (plusSearchItem) plusSearchItem.onclick = function (e) {
                e.stopPropagation();
                setSearch(!searchOn);
            };
            renderThinkBtn();

            const attachBtn = $('attachBtn');
            const attachInput = $('attachInput');
            const plusMenuEl = $('plusMenu');
            if (attachBtn) {
                attachBtn.onclick = function (e) {
                    e.stopPropagation();
                    if (plusMenuEl && plusMenuEl.classList.contains('open')) { closePlusMenu(); return; }
                    openPlusMenu();
                };
            }
            const plusFilesBtn = $('plusFilesBtn');
            if (plusFilesBtn) {
                plusFilesBtn.onclick = function () {
                    closePlusMenu();
                    if (!attachInput) return;
                    attachInput.value = '';
                    attachInput.click();
                };
            }
            document.addEventListener('click', function (e) {
                const menu = $('plusMenu');
                if (!menu || !menu.classList.contains('open')) return;
                if (menu.contains(e.target) || (attachBtn && attachBtn.contains(e.target))) return;
                closePlusMenu();
            });
            const ATTACH_TEXT_EXT = ['txt', 'md', 'markdown', 'csv', 'json', 'js', 'mjs', 'ts',
                'jsx', 'tsx', 'py', 'java', 'c', 'h', 'cpp', 'cs', 'php', 'rb', 'go', 'rs',
                'swift', 'kt', 'sql', 'html', 'htm', 'css', 'scss', 'xml', 'yml', 'yaml',
                'ini', 'conf', 'log', 'sh', 'bat', 'env'];
            const ATTACH_IMG_EXT = ['png', 'jpg', 'jpeg', 'webp', 'gif'];
            const ATTACH_MAX_BYTES = 200 * 1024;
            const ATTACH_IMG_MAX_BYTES = 4 * 1024 * 1024;
            const ATTACH_MAX_TOTAL = 10 * 1024 * 1024;

            function isAttachImageFile(file) {
                if (!file) return false;
                if (file.type && /^image\/(png|jpe?g|webp|gif)$/i.test(file.type)) return true;
                const ext = fileExtOf(file.name);
                return ATTACH_IMG_EXT.indexOf(ext) !== -1;
            }

            function isAttachTextFile(file) {
                if (!file) return false;
                if (file.type && file.type.indexOf('text/') === 0) return true;
                if (file.type === 'application/json') return true;
                const ext = fileExtOf(file.name);
                return ATTACH_TEXT_EXT.indexOf(ext) !== -1;
            }

            function pendingFilesTotal() {
                return pendingFiles.reduce(function (a, f) { return a + (f.size || 0); }, 0);
            }

            if (attachInput) {
                attachInput.onchange = function () {
                    const picked = Array.prototype.slice.call(attachInput.files || []);
                    if (!picked.length) return;
                    const room = MAX_ATTACH_FILES - pendingFiles.length;
                    if (room <= 0) {
                        toast(t('attachMaxFiles'), true);
                        return;
                    }
                    const accepted = [];
                    let skipped = 0;
                    for (let i = 0; i < picked.length; i++) {
                        if (accepted.length >= room) { skipped++; continue; }
                        const file = picked[i];
                        const isImg = isAttachImageFile(file);
                        const isTxt = !isImg && isAttachTextFile(file);
                        const maxB = isImg ? ATTACH_IMG_MAX_BYTES : ATTACH_MAX_BYTES;
                        if ((!isImg && !isTxt) || file.size > maxB ||
                            pendingFilesTotal() + accepted.reduce(function (a, f) { return a + f.size; }, 0) + file.size > ATTACH_MAX_TOTAL) {
                            skipped++;
                            continue;
                        }
                        accepted.push(file);
                    }
                    if (!accepted.length) {
                        toast(t('attachUnsupported'), true);
                        return;
                    }
                    if (skipped > 0) toast(t('attachMaxFiles'), true);
                    let done = 0;
                    accepted.forEach(function (file) {
                        const isImg = isAttachImageFile(file);
                        const reader = new FileReader();
                        reader.onload = function () {
                            const raw = String(reader.result || '');
                            const ext = fileExtOf(file.name) || (isImg ? 'png' : 'txt');
                            const entry = {
                                name: file.name,
                                size: file.size,
                                ext: ext,
                                isImage: isImg,
                                mime: file.type || (isImg ? 'image/' + (ext === 'jpg' ? 'jpeg' : ext) : 'text/plain'),
                                dataUrl: isImg ? raw : undefined,
                                content: raw,
                                stored: raw.length > 60000 ? raw.slice(0, 60000) : raw,
                                trimmed: raw.length > 60000
                            };
                            pendingFiles.push(entry);
                            renderAttachChips();
                            done++;
                            if (done === accepted.length) {
                                toast(accepted.length > 1 || pendingFiles.length > 1
                                    ? t('attachTwoDone')
                                    : t('attachDone') + accepted[0].name + t('attachHint'));
                                const el = $('mainInput');
                                if (el) el.focus();
                            }
                        };
                        reader.onerror = function () { toast(t('readFail'), true); };
                        if (isImg) reader.readAsDataURL(file);
                        else reader.readAsText(file, 'utf-8');
                    });
                };
            }

            const fvClose = $('fileViewerClose');
            if (fvClose) fvClose.onclick = closeFileViewer;
            const fvOverlay = $('fileViewerOverlay');
            if (fvOverlay) {
                fvOverlay.onclick = function (e) {
                    if (e.target === fvOverlay) closeFileViewer();
                };
            }
            const fvCopy = $('fileViewerCopy');
            if (fvCopy) {
                fvCopy.onclick = function () {
                    const code = $('fileViewerCode');
                    copyText(code ? code.textContent : '');
                };
            }

            const micBtn = $('micBtn');
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            let recognition = null;
            let isRecording = false;
            let voiceTranscript = '';
            let voiceAutoSend = false;
            function stopVoiceUi() {
                isRecording = false;
                if (micBtn) {
                    micBtn.classList.remove('recording');
                    micBtn.classList.remove('waiting');
                    micBtn.setAttribute('aria-label', t('micStop'));
                }
                const el = $('mainInput');
                if (el) el.placeholder = t('inputPlaceholder');
            }

            function setVoiceWaiting(on) {
                if (!micBtn) return;
                micBtn.classList.toggle('waiting', !!on);
                const el = $('mainInput');
                if (!el) return;
                if (on) el.placeholder = t('micWaiting');
                else el.placeholder = t('inputPlaceholder');
            }

            function voiceCurrentText() {
                const el = $('mainInput');
                const typed = el ? el.value.trim() : '';
                const heard = (voiceTranscript || '').trim();
                if (!typed) return heard;
                if (!heard) return typed;
                return typed.length >= heard.length ? typed : heard;
            }

            function voiceWaitThenSend() {
                setVoiceWaiting(true);
                const started = Date.now();
                let lastText = '';
                let stable = 0;
                (function poll() {
                    const current = voiceCurrentText();
                    if (current && current === lastText) stable++;
                    else stable = 0;
                    lastText = current;
                    const settled = (current && stable >= 2) || Date.now() - started > 2600;
                    if (!settled) {
                        setTimeout(poll, 150);
                        return;
                    }
                    const el = $('mainInput');
                    if (!current) {
                        setVoiceWaiting(false);
                        toast(t('micNoCapture'), true);
                        return;
                    }
                    if (el) {
                        el.value = current;
                        el.style.height = 'auto';
                        el.style.height = Math.min(160, el.scrollHeight) + 'px';
                    }
                    setVoiceWaiting(false);
                    toast(t('micConvertingDone'));
                    send();
                })();
            }

            function stopRecognition() {
                voiceAutoSend = false;
                if (recognition) {
                    try { recognition.stop(); } catch (err) {}
                }
                setVoiceWaiting(false);
            }

            if (micBtn) {
                if (!SpeechRec) {
                    micBtn.hidden = true;
                } else {
                    recognition = new SpeechRec();
                    recognition.continuous = true;
                    recognition.interimResults = true;
                    recognition.maxAlternatives = 1;
                    recognition.lang = (navigator.language && /^ar/i.test(navigator.language)) ? 'ar-SA' : (navigator.language || 'ar-SA');

                    recognition.onstart = function () {
                        isRecording = true;
                        voiceTranscript = '';
                        if (micBtn) {
                            micBtn.classList.add('recording');
                            micBtn.setAttribute('aria-label', t('micRecAria'));
                        }
                        const el = $('mainInput');
                        if (el) el.placeholder = t('micListening');
                        toast(t('micStart'));
                    };

                    recognition.onresult = function (event) {
                        let interim = '';
                        for (let i = event.resultIndex; i < event.results.length; i++) {
                            const res = event.results[i];
                            const chunk = res[0] ? res[0].transcript : '';
                            if (res.isFinal) voiceTranscript += chunk;
                            else interim += chunk;
                        }
                        const el = $('mainInput');
                        if (el) {
                            el.value = (voiceTranscript + interim).replace(/^\s+/, '');
                            el.style.height = 'auto';
                            el.style.height = Math.min(160, el.scrollHeight) + 'px';
                        }
                    };

                    recognition.onerror = function (event) {
                        const code = event && event.error ? event.error : '';
                        stopVoiceUi();
                        if (code === 'not-allowed' || code === 'service-not-allowed') {
                            toast(t('micDenied'), true);
                        } else if (code === 'no-speech') {
                            toast(t('micNoSpeech'), true);
                        } else if (code !== 'aborted') {
                            toast(t('micFailed'), true);
                        }
                    };

                    recognition.onend = function () {
                        const shouldSend = voiceAutoSend;
                        voiceAutoSend = false;
                        if (!shouldSend) {
                            stopVoiceUi();
                            return;
                        }
                        isRecording = false;
                        if (micBtn) {
                            micBtn.classList.remove('recording');
                            micBtn.setAttribute('aria-label', t('micStop'));
                        }
                        voiceWaitThenSend();
                    };

                    micBtn.onclick = function () {
                        if (micBtn.classList.contains('waiting')) return;
                        if (isRecording) {
                            voiceAutoSend = true;
                            const el = $('mainInput');
                            const heard = (voiceTranscript || '').trim();
                            if (el && !el.value.trim() && heard) el.value = heard;
                            voiceTranscript = el ? el.value : heard;
                            setVoiceWaiting(true);
                            toast(t('micConverting'));
                            try {
                                recognition.stop();
                            } catch (err) {
                                voiceWaitThenSend();
                            }
                        } else {
                            voiceAutoSend = false;
                            voiceTranscript = '';
                            try {
                                recognition.start();
                            } catch (err) {
                                toast(t('micStartFail'), true);
                            }
                        }
                    };
                }
            }

            const themes = ['dark', 'light'];
            let themeIndex = 0;
            try {
                const savedTheme = readStore(STORE_THEME, LEGACY_KEYS.theme, 'dark');
                if (savedTheme === 'light') themeIndex = 1;
                else if (savedTheme === 'dark') themeIndex = 0;
            } catch (e) { themeIndex = 0; }

            function applyTheme() {
                document.documentElement.setAttribute('data-theme', themes[themeIndex]);
                document.querySelectorAll('.theme-pill[data-theme]').forEach(function (pill) {
                    pill.classList.toggle('active', pill.getAttribute('data-theme') === themes[themeIndex]);
                });
            }
            applyTheme();

            document.querySelectorAll('.theme-pill[data-theme]').forEach((pill, index) => {
                pill.onclick = function() {
                    themeIndex = index;
                    try { localStorage.setItem(STORE_THEME, themes[themeIndex]); } catch (e) {}
                    applyTheme();
                    toast(t('themeChanged'));
                };
            });

            document.querySelectorAll('.theme-pill[data-lang]').forEach(function (pill) {
                pill.onclick = function () {
                    const next = this.getAttribute('data-lang');
                    if (next !== 'ar' && next !== 'en') return;
                    LANG = next;
                    try { localStorage.setItem(STORE_LANG, LANG); } catch (e) {}
                    applyLang();
                    toast(t('langChanged'));
                };
            });

            function isTypingField(target) {
                if (!target) return false;
                const tag = String(target.tagName || '').toLowerCase();
                return tag === 'textarea' || tag === 'input' || target.isContentEditable === true;
            }

            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                    e.preventDefault();
                    newChat();
                }
                if (e.key === 'Escape') {
                    closePlusMenu();
                    const settings = $('settingsOverlay');
                    if (settings && settings.classList.contains('open')) closeSettings();
                    closeFileViewer();
                    closeCodePreview();
                    stopRecognition();
                }
            });

            if (!SYSTEM_PROMPT) {
                setTimeout(function () {
                    toast(t('promptMissing'), true);
                }, 900);
            }

            watchScroll();
            applyLang();
            renderModels();
            renderHistory();

            if (chats && chats.length > 0) {
                const last = chats[chats.length - 1];
                if (last && last.id) loadChat(last.id);
                else newChat();
            } else {
                newChat();
            }

            window.addEventListener('storage', function (e) {
                if (!e || e.key !== STORE_CHATS && e.key !== STORE_CLEARED) return;
                try {
                    const changed = adoptStoredChats();
                    renderHistory();
                    if (changed && e.key === STORE_CHATS && !isAssistantResponding) {
                        const known = chats.some(function (c) { return String(c.id) === String(currentId); });
                        if (!known && currentId) loadChat(currentId);
                    }
                } catch (err) {}
            });

            window.addEventListener('resize', function() {
                try { applyLang(); } catch (e) {}
                if (window.innerWidth > 768) {
                    const sidebar = $('sidebar');
                    const overlay = $('sidebarOverlay');
                    if (sidebar) sidebar.classList.remove('open');
                    if (overlay) overlay.classList.remove('open');
                }
            });

        })();
    </script>
</body>
</html>
