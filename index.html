<!DOCTYPE html>

<html lang="ar">
<head>
<meta charset="utf-8"/>

<title>WORMGPT – دردشة مجانية</title>

<meta content="WORMGPT" name="application-name"/>
<meta content="#0d0507" name="theme-color"/>
<meta content="WORMGPT" property="og:title"/>
<meta content="WORMGPT – دردشة ذكاء اصطناعي مجانية" property="og:description"/>
<link href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0507'/%3E%3Cg fill='none' stroke='%23ff2233' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M20.5 6.6c0 3.4-9 3-9 7.4s8.2 3.6 8.2 7.4c0 2-1.7 3.4-4.2 3.4'/%3E%3Ccircle cx='20.5' cy='6.6' r='2.4' fill='%23ff2233' stroke='none'/%3E%3C/g%3E%3C/svg%3E" rel="icon" type="image/svg+xml"/>

<script src="config.js"></script>
<script src="prompt.js"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Noto+Sans+Arabic:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<style>
        :root {
            --bg: #0a0506;
            --sidebar-bg: #0d0608;
            --surface: #17090c;
            --surface-hover: #210d11;
            --border: #2c1014;
            --border-strong: #43181d;
            --text-primary: #f7ecec;
            --text-secondary: #c0a3a6;
            --text-muted: #8e6e72;
            --accent: #ff2233;
            --accent-strong: #ff3b4a;
            --accent-deep: #b3121f;
            --accent-soft: rgba(255, 34, 51, 0.10);
            --accent-glow: rgba(255, 34, 51, 0.30);
            --accent-bg: rgba(255, 34, 51, 0.08);
            --code-bg: #0f0507;
            --tok-comment: #8b8189;
            --tok-string: #ffb3a7;
            --tok-number: #ffcf6b;
            --tok-keyword: #ff6b7f;
            --tok-type: #7fd1ff;
            --tok-func: #d7b3ff;
            --tok-op: #ff9fae;
            --tok-punct: #c9b6bb;
            --tok-added: #5ad19a;
            --tok-removed: #ff7b8a;
            --code-header-bg: #1a0a0d;
            --code-inline-bg: rgba(255, 34, 51, 0.12);
            --user-bubble-bg: linear-gradient(135deg, #ff2233 0%, #c00d1c 100%);
            --user-bubble-text: #ffffff;
            --scrollbar-thumb: #3d1419;
            --font: 'Inter', 'Noto Sans Arabic', system-ui, -apple-system, sans-serif;
            --mono: 'JetBrains Mono', 'Consolas', monospace;
            --radius: 10px;
            --radius-sm: 6px;
        }
        [data-theme="light"] {
            --bg: #fffafa;
            --sidebar-bg: #fdf3f4;
            --surface: #fbeef0;
            --surface-hover: #f6e2e5;
            --border: #edccd1;
            --border-strong: #ddadb4;
            --text-primary: #26060a;
            --text-secondary: #6d3b41;
            --text-muted: #97666c;
            --accent: #d4001a;
            --accent-strong: #e01028;
            --accent-deep: #9d0014;
            --accent-soft: rgba(212, 0, 26, 0.08);
            --accent-glow: rgba(212, 0, 26, 0.22);
            --accent-bg: rgba(212, 0, 26, 0.06);
            --code-bg: #fbf0f1;
            --tok-comment: #8a7a7e;
            --tok-string: #a3271f;
            --tok-number: #9a5b00;
            --tok-keyword: #c1121f;
            --tok-type: #17517e;
            --tok-func: #6b2fb3;
            --tok-op: #b3121f;
            --tok-punct: #6d5a5e;
            --tok-added: #10714a;
            --tok-removed: #b3121f;
            --code-header-bg: #f4e1e3;
            --code-inline-bg: rgba(212, 0, 26, 0.09);
            --user-bubble-bg: linear-gradient(135deg, #e01028 0%, #a80017 100%);
            --user-bubble-text: #ffffff;
            --scrollbar-thumb: #dbb3b8;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body,
        #root {
            height: 100%;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }
        body {
            font-family: var(--font);
            background:
                radial-gradient(1100px 620px at 88% -10%, var(--accent-soft), transparent 60%),
                radial-gradient(900px 520px at -5% 105%, var(--accent-soft), transparent 60%),
                var(--bg);
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        ::selection {
            background: var(--accent);
            color: #ffffff;
        }
        button {
            font-family: var(--font);
            cursor: pointer;
            border: none;
            background: none;
            color: inherit;
            font-size: inherit;
        }
        a {
            color: inherit;
            text-decoration: none;
        }
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-deep);
        }

        .app {
            display: flex;
            flex-direction: row;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
        }
        html[dir="rtl"] .app {
            flex-direction: row;
        }
        html[dir="ltr"] .app {
            flex-direction: row;
        }

        .sidebar {
            width: 220px;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: width 0.2s ease, transform 0.25s ease;
            overflow: hidden;
            z-index: 100;
            border-left: 1px solid var(--border);
            box-shadow: -1px 0 22px -14px var(--accent-glow);
        }
        html[dir="ltr"] .sidebar {
            border-left: none;
            border-right: 1px solid var(--border);
            box-shadow: 1px 0 22px -14px var(--accent-glow);
        }
        .sidebar-header {
            padding: 14px 16px 10px;
            flex-shrink: 0;
        }
        .sidebar-header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            min-width: 0;
        }
        .sidebar-logo svg {
            width: 26px;
            height: 26px;
            color: var(--accent);
            filter: drop-shadow(0 0 6px var(--accent-glow));
            flex-shrink: 0;
        }
        .sidebar-logo-text {
            font-weight: 800;
            font-size: 17px;
            letter-spacing: 0.02em;
            white-space: nowrap;
            color: var(--accent);
            text-shadow: 0 0 14px var(--accent-glow);
        }
        .sidebar-collapse-btn {
            width: 28px;
            height: 28px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: all 0.12s;
            flex-shrink: 0;
        }
        .sidebar-collapse-btn:hover {
            color: var(--accent);
            background: var(--accent-soft);
        }
        .sidebar-collapse-btn svg {
            width: 15px;
            height: 15px;
        }
        .new-chat-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 8px 12px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
            border: 1px solid var(--accent-deep);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
            transition: all 0.15s;
            overflow: hidden;
            box-shadow: 0 2px 14px var(--accent-soft);
        }
        .new-chat-btn:hover {
            background: linear-gradient(135deg, var(--accent-strong) 0%, var(--accent-deep) 100%);
            border-color: var(--accent);
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .new-chat-btn svg {
            opacity: 0.95;
            flex-shrink: 0;
            width: 16px;
            height: 16px;
        }
        .new-chat-label {
            white-space: nowrap;
        }

        .sidebar-chats {
            flex: 1;
            overflow-y: auto;
            padding: 4px 10px;
        }
        .chat-group-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            padding: 12px 8px 4px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 2px;
            text-align: right;
        }
        html[dir="ltr"] .chat-group-label {
            text-align: left;
        }
        .history-empty {
            padding: 12px 8px;
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
        }
        .history-item {
            display: block;
            width: 100%;
            text-align: right;
            direction: rtl;
            padding: 6px 8px;
            font-size: 13px;
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            transition: all 0.12s;
            cursor: pointer;
            -webkit-touch-callout: none;
            user-select: none;
        }
        html[dir="ltr"] .history-item {
            text-align: left;
            direction: ltr;
        }
        .history-item:hover {
            color: var(--text-primary);
            background: var(--surface);
        }
        .history-item.active {
            color: var(--accent);
            font-weight: 600;
            background: var(--accent-soft);
            box-shadow: inset -2px 0 0 var(--accent);
        }
        html[dir="ltr"] .history-item.active {
            box-shadow: inset 2px 0 0 var(--accent);
        }

        .sidebar-bottom {
            padding: 8px 10px 12px;
            flex-shrink: 0;
            border-top: 1px solid var(--border);
        }
        .settings-trigger {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
            padding: 6px 8px;
            font-size: 13px;
            color: var(--text-muted);
            border-radius: var(--radius-sm);
            transition: all 0.12s;
            overflow: hidden;
        }
        .settings-trigger:hover {
            color: var(--accent);
            background: var(--accent-soft);
        }
        .settings-trigger svg {
            width: 14px;
            height: 14px;
            opacity: 0.6;
            flex-shrink: 0;
        }
        .settings-label {
            white-space: nowrap;
        }

        .sidebar.collapsed {
            width: 60px;
        }
        .sidebar.collapsed .sidebar-header {
            padding: 10px 4px 6px;
        }
        .sidebar.collapsed .sidebar-header-top {
            justify-content: center;
            margin-bottom: 6px;
        }
        .sidebar.collapsed .sidebar-logo-text {
            display: none;
        }
        .sidebar.collapsed .sidebar-collapse-btn {
            width: 32px;
            height: 32px;
        }
        .sidebar.collapsed .new-chat-btn {
            padding: 8px;
            gap: 0;
            border-radius: var(--radius-sm);
        }
        .sidebar.collapsed .new-chat-label {
            display: none;
        }
        .sidebar.collapsed .sidebar-chats {
            padding: 2px 4px;
        }
        .sidebar.collapsed .chat-group-label {
            font-size: 0;
            padding: 10px 0 2px;
            border-bottom: none;
        }
        .sidebar.collapsed .history-item {
            padding: 6px 0;
            text-align: center;
            font-size: 0;
        }
        .sidebar.collapsed .history-item::first-letter {
            font-size: 13px;
        }
        .sidebar.collapsed .sidebar-bottom {
            padding: 4px 4px 8px;
        }
        .sidebar.collapsed .settings-trigger {
            justify-content: center;
            padding: 8px 0;
            border-radius: var(--radius-sm);
        }
        .sidebar.collapsed .settings-label {
            display: none;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 99;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }
        .sidebar-overlay.open {
            display: block;
        }

        .settings-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 500;
            align-items: center;
            justify-content: center;
        }
        .settings-overlay.open {
            display: flex;
        }
        .settings-modal {
            background: var(--bg);
            border: 1px solid var(--border-strong);
            border-radius: 16px;
            width: 480px;
            max-width: calc(100vw - 32px);
            overflow: hidden;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5), 0 0 60px -30px var(--accent-glow);
        }
        .settings-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
        }
        .settings-modal-header h3 {
            font-size: 15px;
            font-weight: 600;
        }
        .settings-modal-close {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: all 0.12s;
        }
        .settings-modal-close:hover {
            background: var(--surface-hover);
            color: var(--text-primary);
        }
        .settings-modal-close svg {
            width: 18px;
            height: 18px;
        }
        .settings-modal-body {
            padding: 4px 0;
            max-height: min(70vh, 560px);
            overflow-y: auto;
        }
        .settings-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            transition: background 0.1s;
        }
        .settings-item:hover {
            background: var(--surface-hover);
        }
        .settings-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .settings-item-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius);
            background: var(--accent-soft);
            border: 1px solid var(--border-strong);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            flex-shrink: 0;
        }
        .settings-item-icon svg {
            width: 17px;
            height: 17px;
        }
        .settings-item-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
        }
        .settings-item-desc {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 1px;
        }
        .theme-pills {
            display: flex;
            gap: 2px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 2px;
        }
        .theme-pill {
            padding: 5px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            transition: all 0.12s;
            border: none;
        }
        .theme-pill:hover {
            color: var(--text-primary);
        }
        .theme-pill.active {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
            color: #ffffff;
            box-shadow: 0 2px 10px var(--accent-soft);
        }

        .settings-modal-footer {
            padding: 14px 24px 18px;
            border-top: 1px solid var(--border);
        }
        .clear-all-btn {
            width: 100%;
            padding: 10px;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: transparent;
        }
        .clear-all-btn svg {
            width: 16px;
            height: 16px;
        }
        .clear-all-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-soft);
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        .top-bar {
            padding: 8px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            direction: ltr;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            background: var(--bg);
        }
        .mobile-burger {
            display: none;
            order: 2;
            padding: 6px;
            border-radius: 6px;
            flex-shrink: 0;
            color: var(--text-secondary);
        }
        html[dir="ltr"] .mobile-burger {
            order: 0;
        }
        .mobile-burger:hover {
            background: var(--accent-soft);
            color: var(--accent);
        }
        .mobile-burger svg {
            width: 20px;
            height: 20px;
        }
        .top-bar-inner {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            flex: 1;
            gap: 6px;
            position: relative;
        }
        html[dir="ltr"] .top-bar-inner {
            order: 1;
            justify-content: flex-end;
        }

        .model-badge-static {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            border: 1px solid var(--border-strong);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            background: var(--accent-soft);
            white-space: nowrap;
            box-shadow: inset 0 0 0 1px transparent;
        }
        .model-badge-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 9px var(--accent-glow);
            flex-shrink: 0;
        }

        .messages-wrap {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 16px;
            min-height: 0;
            -webkit-overflow-scrolling: touch;
        }
        .messages-col {
            max-width: 760px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 0;
        }

        .welcome-msg {
            display: flex;
            flex: 1;
            min-height: 300px;
            text-align: center;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 10px 0;
        }
        .welcome-logo {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(150deg, var(--accent) 0%, var(--accent-deep) 100%);
            box-shadow: 0 0 42px var(--accent-glow), 0 10px 30px rgba(0, 0, 0, 0.45);
            flex-shrink: 0;
        }
        .welcome-logo svg {
            width: 42px;
            height: 42px;
            display: block;
        }
        .welcome-title {
            font-size: 34px;
            font-weight: 800;
            line-height: 1.25;
            letter-spacing: -0.01em;
            margin: 0;
            background: linear-gradient(100deg, #ffffff 0%, #ffd9dd 34%, var(--accent) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }
        .welcome-msg .welcome-sub {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-muted);
            max-width: 420px;
            line-height: 1.7;
        }

        .msg {
            display: flex;
            gap: 12px;
            min-width: 0;
            max-width: 100%;
        }
        .msg-user {
            justify-content: flex-end;
        }
        .msg-user .msg-bubble {
            background: var(--user-bubble-bg);
            color: var(--user-bubble-text);
            border-radius: 12px 12px 2px 12px;
            padding: 10px 16px;
            max-width: 78%;
            min-width: 0;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        .msg-user .msg-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: #ffffff;
            flex-shrink: 0;
            order: 1;
        }
        .msg-assistant {
            align-items: flex-start;
            min-width: 0;
        }
        .msg-assistant .msg-content {
            max-width: 100%;
            min-width: 0;
            position: relative;
            flex: 1 1 auto;
        }
        .msg-model-label {
            font-size: 11px;
            font-weight: 600;
            font-family: var(--mono);
            color: var(--accent);
            opacity: 0.85;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .msg-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 6px;
        }
        .msg-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            border: none;
            cursor: pointer;
            transition: all 0.12s;
            background: none;
        }
        .msg-action-btn:hover {
            color: var(--accent);
            background: var(--accent-soft);
        }

        .input-area {
            padding: 0 16px 16px;

                const saved = readStore(STORE_CHATS, LEGACY_KEYS.chats, null);
                if (saved) chats = JSON.parse(saved);
                if (!Array.isArray(chats)) chats = [];
            } catch (e) { chats = []; }

            let clearedSeen = 0;
            try { clearedSeen = Number(localStorage.getItem(STORE_CLEARED)) || 0; } catch (e) { clearedSeen = 0; }

            function readStoredChats() {
                try {
                    const raw = localStorage.getItem(STORE_CHATS);
                    const parsed = raw ? JSON.parse(raw) : [];
                    return Array.isArray(parsed) ? parsed : [];
                } catch (e) { return []; }
            }

            function storedClearedAt() {
                try { return Number(localStorage.getItem(STORE_CLEARED)) || 0; } catch (e) { return 0; }
            }

            function countMessages(chat) {
                if (!chat || !Array.isArray(chat.messages)) return 0;
                let n = 0;
                for (let i = 0; i < chat.messages.length; i++) {
                    if (chat.messages[i] && !chat.messages[i].partial) n++;
                }
                return n;
            }

            function mergeChats(mine, stored) {
                const out = [];
                const index = new Map();
                const push = function (chat) {
                    if (!chat || typeof chat !== 'object' || chat.id === undefined || chat.id === null) return;
                    const key = String(chat.id);
                    if (index.has(key)) { out[index.get(key)] = chat; return; }
                    index.set(key, out.length);
                    out.push(chat);
                };
                (Array.isArray(stored) ? stored : []).forEach(push);
                (Array.isArray(mine) ? mine : []).forEach(function (chat) {
                    const key = String(chat.id);
                    if (!index.has(key)) { push(chat); return; }
                    const at = index.get(key);
                    const known = out[at];
                    if (key === String(currentId)) { out[at] = chat; return; }
                    if (countMessages(chat) > countMessages(known)) { out[at] = chat; return; }
                    if ((chat.renamedAt || 0) > (known.renamedAt || 0)) {
                        out[at].title = chat.title;
                        out[at].renamedAt = chat.renamedAt;
                    }
                });
                out.sort(function (a, b) {
                    const ta = Number(a && a.id) || 0;
                    const tb = Number(b && b.id) || 0;
                    return ta - tb;
                });
                return out;
            }

            function adoptStoredChats() {
                const cleared = storedClearedAt();
                if (cleared > clearedSeen) {
                    clearedSeen = cleared;
                    chats = [];
                }
                const stored = readStoredChats();
                if (!stored.length) return false;
                const before = chats.length;
                chats = mergeChats(chats, stored);
                return chats.length !== before || stored.length !== before;

            function currentLang() {

                    if (v === 'en' || v === 'ar') return v;

                return 'ar';
            }

            let LANG = currentLang();

            function t(key) {
                const table = I18N[LANG] || I18N.ar;
                if (table[key] !== undefined) return table[key];
                if (I18N.ar[key] !== undefined) return I18N.ar[key];
                return key;
            }

            function applyLang() {

                document.documentElement.setAttribute('lang', LANG);
                document.documentElement.setAttribute('dir', table.dir);
                document.title = LANG === 'en' ? 'WORMGPT – Free AI Chat' : 'WORMGPT – دردشة مجانية';
                document.querySelectorAll('[data-i18n]').forEach(function (el) {
                    const key = el.getAttribute('data-i18n');
                    if (table[key] !== undefined) el.textContent = table[key];
                });
                const narrow = (window.innerWidth || 400) <= 400;
                document.querySelectorAll('[data-i18n-ph]').forEach(function (el) {
                    const key = el.getAttribute('data-i18n-ph');
                    const shortKey = key + 'Short';
                    const value = narrow && table[shortKey] !== undefined ? table[shortKey] : table[key];
                    if (value !== undefined) el.placeholder = value;
                });
                document.querySelectorAll('[data-i18n-aria]').forEach(function (el) {
                    const key = el.getAttribute('data-i18n-aria');
                    if (table[key] !== undefined) el.setAttribute('aria-label', table[key]);
                });
                document.querySelectorAll('[data-i18n-title]').forEach(function (el) {
                    const key = el.getAttribute('data-i18n-title');
                    if (table[key] !== undefined) el.setAttribute('title', table[key]);
                });
                document.querySelectorAll('.theme-pill[data-lang]').forEach(function (pill) {
                    pill.classList.toggle('active', pill.getAttribute('data-lang') === LANG);
                });
                const wt = document.querySelector('.welcome-title');
                if (wt) wt.textContent = table.welcomeTitle;
                const ws = document.querySelector('.welcome-sub');
                if (ws) ws.textContent = table.welcomeSub;
                const pt = $('previewTitle');
                if (pt && !pt.textContent.trim()) pt.textContent = table.previewTitle;
                if (!isAssistantResponding && currentId && chats.some(function (c) { return c.id === currentId; })) {
                    loadChat(currentId);
                }
                renderHistory();
                updateUI();
            }

            function toast(text, isError = false) {
                const t = document.createElement('div');
                t.className = 'toast' + (isError ? ' toast-error' : '');
                t.setAttribute('role', 'status');
                t.style.cssText =
                    'position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);padding:8px 20px;border-radius:30px;font-size:13px;color:var(--text-primary);z-index:999;box-shadow:0 4px 16px rgba(0,0,0,0.3);transition:opacity 0.3s;max-width:90%;text-align:center;';
                t.textContent = text;
                if (isError) t.style.borderColor = 'var(--accent)';
                document.body.appendChild(t);
                setTimeout(() => { t.style.opacity = '0';
                    setTimeout(() => t.remove(), 300); }, 3000);
            }

            function safe(s) {
                if (s === null || s === undefined) return '';
                return String(s).replace(/[&<>"']/g, c =>
                    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
                );
            }

            let dirtySince = 0;
            function markDirty() {
                if (!dirtySince) dirtySince = Date.now();
            }
            function flushDirty() {
                if (!dirtySince) return;
                dirtySince = 0;
                saveChats();
            }
            setInterval(flushDirty, 2000);

            function flushNow() {
                dirtySince = 0;
                saveChats();
            }
            window.addEventListener('pagehide', flushNow);
            window.addEventListener('beforeunload', flushNow);
            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'hidden') flushNow();
            });

            function fileExtOf(name) {
                const dot = String(name || '').lastIndexOf('.');
                return dot === -1 ? '' : String(name).slice(dot + 1).toLowerCase();
            }

            function humanSize(bytes) {
                if (typeof bytes !== 'number' || isNaN(bytes)) return '';
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            }

            function messageContentForModel(m) {
                let out = m.text || '';
                if (m.files && m.files.length) {
                    out += m.files.filter(function (f) { return f && !f.isImage; }).map(function (f) {
                        return '\n\n```' + (f.ext || '') + '\n' + fileContentOf(f) + '\n```';
                    }).join('');
                }
                return out;
            }

                if (!menu) return;
                menu.classList.add('open');

                renderThinkBtn();

                const thinkItem = $('plusThinkBtn');
                if (thinkItem) {
                    thinkItem.setAttribute('aria-checked', thinkingOn ? 'true' : 'false');
                    const state = $('thinkState');
                    if (state) state.textContent = thinkingOn ? t('stateOn') : t('stateOff');

                thinkingOn = !!on;
                try { localStorage.setItem(STORE_THINK, thinkingOn ? 'on' : 'off'); } catch (e) {}
                renderThinkBtn();
                toast(thinkingOn ? t('thinkOn') : t('thinkOff'));
            }

            function renderAttachChips() {
                const strip = $('attachChips');
                if (!strip) return;
                if (!pendingFiles.length) {
                    strip.innerHTML = '';
                    strip.classList.remove('has-files');
                    strip.classList.remove('multi-row');
                    return;
                }
                strip.classList.add('has-files');
                strip.classList.toggle('multi-row', pendingFiles.length > 2);
                const counter = '<span class="attach-chip-count">' + pendingFiles.length + '/' + MAX_ATTACH_FILES + '</span>';
                strip.innerHTML = pendingFiles.map(function (f, i) {
                    const thumb = (f.isImage && f.dataUrl)
                        ? '<img class="attach-chip-thumb" src="' + safe(f.dataUrl) + '" alt=""/>'
                        : '';
                    return '<div class="attach-chip">' +
                        '<button class="attach-chip-open" type="button" data-action="view" data-idx="' + i + '" title="' + safe(t('openCode')) + '">' +
                            thumb +
                            '<span class="attach-chip-ext">' + safe((f.ext || 'FILE').toUpperCase().slice(0, 5)) + '</span>' +
                            '<span class="attach-chip-name">' + safe(f.name) + '</span>' +
                            '<span class="attach-chip-meta">' + safe(humanSize(f.size)) + '</span>' +
                        '</button>' +
                        '<button class="attach-chip-x" type="button" data-action="remove" data-idx="' + i + '" aria-label="' + safe(t('removeFile')) + '">&#10005;</button>' +
                    '</div>';
                }).join('') + counter;
                strip.querySelectorAll('button[data-action]').forEach(function (btn) {
                    btn.onclick = function (e) {
                        e.stopPropagation();
                        const i = parseInt(this.getAttribute('data-idx'), 10);
                        if (isNaN(i) || !pendingFiles[i]) return;
                        if (this.getAttribute('data-action') === 'remove') {
                            pendingFiles.splice(i, 1);
                            renderAttachChips();
                        } else {
                            openFileViewer(pendingFiles[i]);
                        }
                    };
                });
            }

            function fileContentOf(file) {
                if (!file) return '';

                    if (code) { code.textContent = ''; code.style.display = 'none'; }

                } else {

                    if (copyBtn) copyBtn.style.display = '';
                    if (code) {

            function renderInlineMarkdown(source) {
                const protectedParts = [];
                const protect = html => {
                    const token = `\uE000${protectedParts.length}\uE001`;
                    protectedParts.push(html);

                };

                let prepared = String(source);

                prepared = prepared.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g,
                    function(match, label, url, title) {
                        if (!/^(https?:\/\/|mailto:|\/(?!\/)|#)/i.test(url)) return match;
                        const titleAttr = title ? ` title="${safe(title)}"` : '';
                        return protect(`<a href="${safe(url)}" target="_blank" rel="noopener noreferrer"${titleAttr}>${renderInlineMarkdown(label)}</a>`);
                    });

                let html = safe(prepared);
                html = html.replace(/~~([^\n]+?)~~/g, '<del>$1</del>');
                html = html.replace(/\*\*([^\n]+?)\*\*/g, '<strong>$1</strong>');
                html = html.replace(/__([^\n]+?)__/g, '<strong>$1</strong>');
                html = html.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
                html = html.replace(/(^|[^\w])_([^_\n]+)_(?=[^\w]|$)/g, '$1<em>$2</em>');
                html = html.replace(/\uE000(\d+)\uE001/g, function(_, index) {
                    return protectedParts[Number(index)] || '';

                return html;

            function splitMarkdownTableRow(line) {
                return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => cell.trim());

            function renderMarkdownBlocks(source) {
                const lines = String(source).replace(/\r\n?/g, '\n').split('\n');
                let html = '';
                let paragraph = [];
                let i = 0;

                const flushParagraph = () => {
                    if (!paragraph.length) return;
                    html += `<p>${paragraph.map(renderInlineMarkdown).join('<br>')}</p>`;
                    paragraph = [];

                while (i < lines.length) {
                    const line = lines[i];
                    if (!line.trim()) {
                        flushParagraph();

                    }

                    const heading = line.match(/^\s{0,3}(#{1,6})\s+(.+?)\s*#*\s*$/);
                    if (heading) {
                        flushParagraph();
                        const level = heading[1].length;
                        html += `<h${level}>${renderInlineMarkdown(heading[2])}</h${level}>`;
                        i++;
                        continue;
                    }

                    if (/^\s{0,3}(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
                        flushParagraph();
                        html += '<hr>';
                        i++;
                        continue;
                    }

                    if (i + 1 < lines.length && line.includes('|')) {
                        const separators = splitMarkdownTableRow(lines[i + 1]);
                        if (separators.length > 1 && separators.every(cell => /^:?-{3,}:?$/.test(cell))) {
                            flushParagraph();
                            const headers = splitMarkdownTableRow(line);
                            const alignments = separators.map(cell =>
                                cell.startsWith(':') && cell.endsWith(':') ? 'center' :
                                cell.endsWith(':') ? 'right' : cell.startsWith(':') ? 'left' : 'start'
                            );
                            const cellHtml = (cells, header = false) => cells.map((cell, index) => {
                                const tag = header ? 'th' : 'td';
                                const align = alignments[index] && alignments[index] !== 'start'
                                    ? ` style="text-align:${alignments[index]}"` : '';
                                return `<${tag}${align}>${renderInlineMarkdown(cell || '')}</${tag}>`;
                            }).join('');
                            html += `<div class="md-table-wrap"><table><thead><tr>${cellHtml(headers, true)}</tr></thead><tbody>`;
                            i += 2;
                            while (i < lines.length && lines[i].trim() && lines[i].includes('|')) {
                                const row = splitMarkdownTableRow(lines[i]);
                                while (row.length < headers.length) row.push('');
                                html += `<tr>${cellHtml(row.slice(0, headers.length))}</tr>`;
                                i++;
                            }
                            html += '</tbody></table></div>';
                            continue;
                        }
                    }

                    if (/^\s{0,3}>/.test(line)) {
                        flushParagraph();
                        const quoteLines = [];
                        while (i < lines.length && /^\s{0,3}>/.test(lines[i])) {
                            quoteLines.push(lines[i].replace(/^\s{0,3}>\s?/, ''));
                            i++;
                        }
                        html += `<blockquote>${renderMarkdownBlocks(quoteLines.join('\n'))}</blockquote>`;
                        continue;
                    }

                    const fenceOpen = line.match(/^\s*(?:```|~~~)\s*([^\s`~]*)/);
                    if (fenceOpen) {
                        flushParagraph();
                        const fence = line.trim().slice(0, 3);
                        const language = fenceOpen[1] || 'text';
                        const codeLines = [];
                        i++;
                        while (i < lines.length && lines[i].trim().slice(0, 3) !== fence) {
                            codeLines.push(lines[i]);
                            i++;
                        }
                        if (i < lines.length) i++;
                        html += renderCodeCard(language, codeLines.join('\n'));
                        continue;
                    }

                    const listItem = line.match(/^\s*(?:([-+*])|(\d+)[.)])\s+(.+)$/);
                    if (listItem) {
                        flushParagraph();
                        const ordered = Boolean(listItem[2]);
                        const tag = ordered ? 'ol' : 'ul';
                        const items = [];
                        let hasTask = false;
                        while (i < lines.length) {
                            const item = lines[i].match(/^\s*(?:([-+*])|(\d+)[.)])\s+(.+)$/);
                            if (!item || Boolean(item[2]) !== ordered) break;
                            let body = item[3];
                            const task = body.match(/^\[([ xX])\]\s*(.*)$/);
                            if (task) {
                                hasTask = true;
                                const mark = task[1].toLowerCase() === 'x' ? '☑' : '☐';
                                body = `<span class="md-check">${mark}</span><span>${renderInlineMarkdown(task[2])}</span>`;
                            } else {
                                body = renderInlineMarkdown(body);
                            }
                            items.push(`<li>${body}</li>`);
                            i++;
                        }
                        let attrs = hasTask ? ' class="task-list"' : '';
                        if (ordered && Number(listItem[2]) > 1) attrs += ` start="${Number(listItem[2])}"`;
                        html += `<${tag}${attrs}>${items.join('')}</${tag}>`;
                        continue;
                    }

                    paragraph.push(line);
                    i++;
                }

                flushParagraph();
                return html;
            }

            function renderMarkdown(text, opts) {
                if (text === null || text === undefined || text === '') return '';
                const plain = Boolean(opts && opts.plain);
                const source = String(text).replace(/\r\n?/g, '\n');
                const fencePattern = /(?:^|\n)(?:```|~~~)[ \t]*([^\n`~]*)\n([\s\S]*?)(?:\n(?:```|~~~)|$)/g;
                let html = '';
                let cursor = 0;
                let match;

                while ((match = fencePattern.exec(source)) !== null) {
                    html += renderMarkdownBlocks(source.slice(cursor, match.index));
                    const language = (match[1].trim().split(/\s+/)[0] || 'text').slice(0, 40);
                    const code = match[2].replace(/\n$/, '');
                    html += renderCodeCard(language, code, plain);
                    cursor = fencePattern.lastIndex;
                }

                html += renderMarkdownBlocks(source.slice(cursor));
                return html;
            }

                FAM.ocaml = { line: [], block: [['(*', '*)']], triple: false, kws: common };
                FAM.pascal = { line: ['//'], block: [['{', '}'], ['(*', '*)']], triple: false, kws: common };
                FAM.vbnet = { line: ["'"], block: [], triple: false, kws: common };
                FAM.ada = { line: ['--'], block: [], triple: false, kws: common };
                FAM.fortran = { line: ['!'], block: [], triple: false, kws: common };
                FAM.cobol = { line: ['*>'], block: [], triple: false, kws: common };
                FAM.protobuf = FAM.c;

                const tags = set(markuptags);

            function normLang(raw) {
                const key = String(raw || '').trim().toLowerCase().replace(/^language-/, '').replace(/^lang-/, '');
                if (!key) return 'text';
                if (LANG_ALIASES[key]) return LANG_ALIASES[key];
                const cleaned = key.replace(/[^a-z0-9#+]/g, '');
                if (LANG_ALIASES[cleaned]) return LANG_ALIASES[cleaned];
                return cleaned || 'text';
            }

            function langLabel(raw) {
                const key = normLang(raw);
                if (LANG_LABELS[key]) return LANG_LABELS[key];
                if (key === 'text' || key === 'code') return 'Code';
                return key.charAt(0).toUpperCase() + key.slice(1);
            }

            const HL_MAX = 24000;

            function highlightCode(code, lang) {
                const s = String(code === undefined || code === null ? '' : code);
                if (!s) return '';
                const key = normLang(lang);
                const cfg = FAM[key] || FAM.text;
                if (s.length > HL_MAX || (cfg.line.length === 0 && cfg.block.length === 0 && !cfg.kws.size && !cfg.units && !cfg.markup)) {
                    return safe(s);
                }
                const kws = cfg.kws;
                let out = '';
                let i = 0;
                const n = s.length;

                const isWordChar = function (c) {
                    return /[A-Za-z0-9_$]/.test(c);
                };
                const callAhead = function (from) {
                    let j = from;
                    while (j < n && (s[j] === ' ' || s[j] === '\t')) j++;
                    return s[j] === '(';
                };

                while (i < n) {
                    const c = s[i];

                    if (c === '\n' || c === ' ' || c === '\t' || c === '\r') {
                        let j = i;
                        while (j < n && (s[j] === ' ' || s[j] === '\t' || s[j] === '\n' || s[j] === '\r')) j++;
                        out += safe(s.slice(i, j));
                        i = j;
                        continue;
                    }

                    if (cfg.diff && (c === '+' || c === '-') && (i === 0 || s[i - 1] === '\n')) {
                        let j = s.indexOf('\n', i);
                        if (j === -1) j = n;
                        const cls = c === '+' ? 'tok-added' : 'tok-removed';
                        out += '<span class="' + cls + '">' + safe(s.slice(i, j)) + '</span>';
                        i = j;
                        continue;
                    }

                    let matched = false;
                    for (let d = 0; d < cfg.line.length; d++) {
                        const mark = cfg.line[d];
                        if (mark && s.startsWith(mark, i)) {
                            let j = s.indexOf('\n', i);
                            if (j === -1) j = n;
                            out += '<span class="tok-comment">' + safe(s.slice(i, j)) + '</span>';
                            i = j;
                            matched = true;
                            break;
                        }
                    }
                    if (matched) continue;

                    for (let d = 0; d < cfg.block.length; d++) {
                        const pair = cfg.block[d];
                        if (s.startsWith(pair[0], i)) {
                            let j = s.indexOf(pair[1], i + pair[0].length);
                            j = j === -1 ? n : j + pair[1].length;
                            out += '<span class="tok-comment">' + safe(s.slice(i, j)) + '</span>';
                            i = j;
                            matched = true;
                            break;
                        }
                    }
                    if (matched) continue;

                    if (c === '"' || c === "'" || (c === '`' && (key === 'javascript' || key === 'typescript' || key === 'jsx' || key === 'tsx'))) {
                        if (cfg.triple && s.startsWith(c + c + c, i)) {
                            let j = s.indexOf(c + c + c, i + 3);
                            j = j === -1 ? n : j + 3;
                            out += '<span class="tok-string">' + safe(s.slice(i, j)) + '</span>';
                            i = j;
                            continue;
                        }
                        let j = i + 1;
                        while (j < n) {
                            if (s[j] === '\\') { j += 2; continue; }
                            if (s[j] === c) { j++; break; }
                            if (s[j] === '\n' && c !== '`') break;
                            j++;
                        }
                        if (j > n) j = n;
                        out += '<span class="tok-string">' + safe(s.slice(i, j)) + '</span>';
                        i = j;
                        continue;
                    }

                    if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(s[i + 1] || ''))) {
                        const numMatch = /^(?:0[xX][0-9a-fA-F_]+|0[bB][01_]+|0[oO][0-7_]+|\d[\d_]*(?:\.[\d_]+)?(?:[eE][+-]?\d+)?)/.exec(s.slice(i));
                        if (numMatch) {
                            let j = i + numMatch[0].length;
                            let unit = '';
                            if (cfg.units) {
                                const unitMatch = /^(?:px|em|rem|vh|vw|vmin|vmax|%|s|ms|deg|rad|fr|ch|ex|pt|pc|cm|mm|in|dpi|Hz|kHz|q)\b/.exec(s.slice(j));
                                if (unitMatch) { unit = unitMatch[0]; j += unit.length; }
                            }
                            out += '<span class="tok-number">' + safe(s.slice(i, j)) + '</span>';
                            i = j;
                            continue;
                        }
                    }

                    if (/[A-Za-z_$@]/.test(c)) {
                        if (cfg.markup && c === '@') {
                            let j = i + 1;
                            while (j < n && /[A-Za-z-]/.test(s[j])) j++;
                            out += '<span class="tok-builtin">' + safe(s.slice(i, j)) + '</span>';
                            i = j;
                            continue;
                        }
                        let j = i;
                        while (j < n && /[A-Za-z0-9_$-]/.test(s[j])) j++;
                        const word = s.slice(i, j);
                        const lower = word.toLowerCase();
                        let cls = '';
                        if (kws.has(lower)) cls = 'tok-keyword';
                        else if (cfg.markup && (lower.indexOf('-') !== -1 ? kws.has(lower) : false)) cls = 'tok-keyword';
                        else if (kws.has(word)) cls = 'tok-keyword';
                        else if (/^[A-Z][A-Za-z0-9_]*$/.test(word) && word.length > 1) cls = 'tok-type';
                        else if (callAhead(j)) cls = 'tok-func';
                        out += cls ? '<span class="' + cls + '">' + safe(word) + '</span>' : safe(word);
                        i = j;
                        continue;
                    }

                    if ('{}()[];,.:'.indexOf(c) !== -1) {
                        out += '<span class="tok-punct">' + safe(c) + '</span>';
                        i++;
                        continue;
                    }

                    if ('+-*/%=<>!&|^~?@#&'.indexOf(c) !== -1) {
                        let j = i;
                        while (j < n && '+-*/%=<>!&|^~?@#&'.indexOf(s[j]) !== -1) j++;
                        out += '<span class="tok-op">' + safe(s.slice(i, j)) + '</span>';
                        i = j;
                        continue;
                    }

                    out += safe(c);
                    i++;
                }
                return out;
            }

            const RUNNABLE_LANGS = ['html', 'htm', 'xhtml', 'svg', 'html5'];
            const CODE_EXT = {
                html: 'html', htm: 'html', xhtml: 'html', svg: 'svg', xml: 'xml',

            function renderCodeCard(language, code, plain) {
                const L = normLang(language);
                const canRun = RUNNABLE_LANGS.indexOf(L) !== -1;
                const body = plain ? safe(String(code || '')) : highlightCode(code, L);
                return '<div class="code-card" data-lang="' + safe(L) + '">' +

            function downloadCode(code, lang) {
                const ext = CODE_EXT[String(lang || '').toLowerCase()] || 'txt';
                const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'wormgpt-code.' + ext;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
            }

            function bindCodeCards(root) {
                if (!root) return;
                root.querySelectorAll('.code-card').forEach(function (cardEl) {
                    const codeEl = cardEl.querySelector('pre code');
                    const lang = String(cardEl.getAttribute('data-lang') || '').toLowerCase();
                    cardEl.querySelectorAll('.code-act').forEach(function (btn) {
                        const act = btn.getAttribute('data-act');
                        if (act === 'copy') {
                            btn.onclick = function (e) {
                                e.stopPropagation();
                                copyText(codeEl ? codeEl.textContent : '');
                                const label = this.querySelector('span');
                                if (!label) return;
                                const prev = label.textContent;
                                const self = this;
                                label.textContent = t('copied');
                                self.classList.add('done');
                                setTimeout(function () {
                                    label.textContent = prev;
                                    self.classList.remove('done');
                                }, 1500);
                            };
                        } else if (act === 'download') {
                            btn.onclick = function (e) {
                                e.stopPropagation();
                                const c = codeEl ? codeEl.textContent : '';
                                if (c) downloadCode(c, lang);
                            };
                        } else if (act === 'run') {
                            btn.onclick = function (e) {
                                e.stopPropagation();
                                const c = codeEl ? codeEl.textContent : '';

            let autoScroll = true;
            let scrollRaf = 0;

            function isNearBottom() {
                const area = $('messagesWrap');
                if (!area) return true;
                return (area.scrollHeight - area.scrollTop - area.clientHeight) < 90;
            }

            function scrollToBottom(force) {
                const area = $('messagesWrap');
                if (!area) return;
                if (force) {
                    autoScroll = true;
                } else if (!autoScroll || !isNearBottom()) {
                    autoScroll = false;
                    return;
                }
                if (scrollRaf) return;
                scrollRaf = requestAnimationFrame(function () {
                    scrollRaf = 0;
                    const el = $('messagesWrap');
                    if (!el) return;
                    if (!force && (!autoScroll || !isNearBottom())) {
                        autoScroll = false;
                        return;
                    }
                    el.scrollTop = el.scrollHeight;
                });
            }

            function watchScroll() {
                const area = $('messagesWrap');
                if (!area) return;
                area.addEventListener('scroll', function () {
                    autoScroll = isNearBottom();
                }, { passive: true });
            }

            function addMessage(role, text, model, isError = false, reasoning = '', files = null) {

                    metaHtml = `<span class="model-badge" style="font-size:11px;font-weight:600;font-family:var(--mono);color:var(--text-muted);">${safe(modelDisplay)}</span>`;

                const reasoningHtml = (role === 'assistant' && reasoning)

                            : '';
                        return '<button class="msg-file-chip" type="button" data-file-idx="' + i + '" title="' + safe(t('openCode')) + '">' +
                            thumb +
                            '<span class="f-ext">' + safe((f.ext || 'FILE').toUpperCase().slice(0, 5)) + '</span>' +

                if (role === 'user') {

                            ${toolsHtml}
                        </div>

                el._wormFiles = userFiles;

                el.querySelectorAll('.msg-file-chip').forEach(function (btn) {
                    btn.onclick = function (e) {

                    regenBtn.onclick = function(e) {

            function copyText(text) {
                if (!text) return;
                const textStr = String(text);
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(textStr).then(() => {
                        toast(t('copiedText'));
                    }).catch(() => {
                        fallbackCopy(textStr);
                    });
                } else {
                    fallbackCopy(textStr);
                }
            }

            function fallbackCopy(text) {
                try {
                    const el = document.createElement('textarea');
                    el.value = text;
                    el.style.position = 'fixed';
                    el.style.opacity = '0';
                    document.body.appendChild(el);
                    el.select();
                    document.execCommand('copy');
                    el.remove();
                    toast(t('copiedText'));
                } catch (e) {
                    toast(t('copyFailed'), true);
                }
            }

            const MAX_CHATS = 200;
            let saveWarningShown = false;

            function trimChats() {
                if (chats.length <= MAX_CHATS) return false;
                chats.sort(function (a, b) {
                    const ta = Number(a.id) || 0;
                    const tb = Number(b.id) || 0;
                    return tb - ta;
                });
                chats = chats.slice(0, MAX_CHATS);
                return true;
            }

            function dropOldestFileContents() {
                const ordered = chats.slice().sort(function (a, b) {
                    return (Number(a.id) || 0) - (Number(b.id) || 0);
                });
                for (let i = 0; i < ordered.length; i++) {
                    const msgs = ordered[i].messages || [];
                    for (let j = 0; j < msgs.length; j++) {
                        const files = msgs[j].files;
                        if (!files || !files.length) continue;
                        for (let k = 0; k < files.length; k++) {
                            if (files[k].content || files[k].dataUrl) {
                                files[k].content = '';
                                files[k].dataUrl = '';
                                files[k].trimmed = true;
                                return true;
                            }
                        }
                    }
                }
                return false;
            }

            function dropOldestImage() {
                const ordered = chats.slice().sort(function (a, b) {
                    return (Number(a.id) || 0) - (Number(b.id) || 0);
                });
                for (let i = 0; i < ordered.length; i++) {
                    const msgs = ordered[i].messages || [];
                    for (let j = 0; j < msgs.length; j++) {
                        if (msgs[j].image) {
                            msgs.splice(j, 1);
                            return true;
                        }
                    }
                }
                return false;
            }

            function saveChats() {
                const beforeMerge = chats.length;
                adoptStoredChats();
                if (chats.length !== beforeMerge) {
                    try { renderHistory(); } catch (e) {}
                }
                trimChats();
                let attempt = 0;
                while (attempt < 60) {
                    try {
                        localStorage.setItem(STORE_CHATS, JSON.stringify(chats));
                        return true;
                    } catch (e) {
                        const isQuota = e && (e.name === 'QuotaExceededError' ||
                            e.code === 22 || e.code === 1014 ||
                            /quota|exceed/i.test(e.message || ''));
                        if (!isQuota) return false;
                        attempt++;
                        const freed = dropOldestFileContents();
                        if (!freed) {
                            if (!dropOldestImage()) {
                                if (chats.length > 1) chats.shift();
                                else return false;
                            }
                        }
                    }
                }
                if (!saveWarningShown) {
                    saveWarningShown = true;
                    try { toast(t('storageFull'), true); } catch (e) {}
                }
                return false;
            }

            let actionChatId = null;

            function renameChatById(id, newTitle) {

                const key = String(id);
                const c = chats.find(function (x) { return String(x.id) === key; });
                if (!c) return false;
                c.title = clean;
                c.renamedAt = Date.now();
                try {
                    const stored = readStoredChats().map(function (sc) {
                        if (sc && String(sc.id) === key) {
                            sc.title = clean;
                            sc.renamedAt = c.renamedAt;

                    });
                    localStorage.setItem(STORE_CHATS, JSON.stringify(stored));

                saveChats();
                renderHistory();
                toast(t('chatRenamed'));
                return true;

            function deleteChatById(id) {
                const key = String(id);
                chats = chats.filter(function (x) { return String(x.id) !== key; });
                try {

            function renderHistory() {

                h.innerHTML = chats.slice().reverse().map(c =>
                    `<button class="history-item ${c.id === currentId ? 'active' : ''}" data-id="${safe(c.id)}">${safe(c.title || t('untitled'))}</button>`
                ).join('');
                h.querySelectorAll('.history-item').forEach(b => {
                    let lpTimer = null;
                    let lpFired = false;
                    let startX = 0;
                    let startY = 0;
                    const id = b.getAttribute('data-id');
                    const clearLp = function () {
                        if (lpTimer) {
                            clearTimeout(lpTimer);
                            lpTimer = null;
                        }
                    };
                    const startLp = function (x, y) {
                        clearLp();
                        lpFired = false;
                        startX = x || 0;
                        startY = y || 0;
                        lpTimer = setTimeout(function () {
                            lpTimer = null;
                            lpFired = true;
                            try { if (navigator.vibrate) navigator.vibrate(15); } catch (e) {}
                            if (id) openChatActionModal(id);
                        }, 450);
                    };
                    b.addEventListener('touchstart', function (e) {
                        const pt = (e.touches && e.touches[0]) || {};
                        startLp(pt.clientX, pt.clientY);
                    }, { passive: true });
                    b.addEventListener('touchmove', function (e) {
                        if (!lpTimer) return;
                        const pt = (e.touches && e.touches[0]) || {};
                        if (Math.abs((pt.clientX || 0) - startX) > 10 || Math.abs((pt.clientY || 0) - startY) > 10) {
                            clearLp();
                        }
                    }, { passive: true });
                    b.addEventListener('touchend', clearLp);
                    b.addEventListener('touchcancel', clearLp);
                    b.addEventListener('mousedown', function (e) {
                        if (e.button && e.button !== 0) return;
                        startLp(e.clientX, e.clientY);
                    });
                    b.addEventListener('mouseup', clearLp);
                    b.addEventListener('mouseleave', clearLp);
                    b.addEventListener('contextmenu', function (e) {
                        e.preventDefault();
                        e.stopPropagation();
                        clearLp();
                        lpFired = true;
                        if (id) openChatActionModal(id);
                    });
                    b.onclick = function (e) {
                        if (lpFired) {
                            lpFired = false;
                            e.preventDefault();
                            e.stopPropagation();
                            return;
                        }
                        if (id) loadChat(id);
                    };
                });
            }

                const pushLiveDelta = function (dText, dReason) {

                    if (systemText) messages.push({ role: 'system', content: systemText });
                    if (c.messages && Array.isArray(c.messages)) {

                    abortController = new AbortController();

                    }, 300000);

                    const cleanMessages = messages
                        .filter(m => m.role !== 'system')
                        .map(m => ({ role: m.role, content: m.content }));

                    const clientTidy = function (str) {
                        let out = String(str || '').replace(/\r\n?/g, '\n').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n');
                        out = out.replace(/(```[^\n]*\n)([\s\S]*?)(```)/g, function (all, open, body, close) {
                            return open + body.replace(/\n{2,}/g, '\n').replace(/^\n+/, '').replace(/\n+$/, '') + '\n' + close;
                        });
                        return out.trim();
                    };

                    const clientStripEcho = function (str) {
                        return String(str || '')
                            .replace(/^\s*(?:\u0645\u0633\u0627\u0639\u062f \u0630\u0643\u064a|WORMGPT|Assistant|ASSISTANT|AI)\s*[::\-–]\s*/i, '')
                            .replace(/^\s*USER\s*[::]\s*/i, '')
                            .trim();
                    };

                    const clientSplitThink = function (rawText) {
                        let txt = clientTidy(String(rawText || ''));
                        let rsn = '';
                        const th = txt.match(/<think[^>]*>([\s\S]*?)<\/think>/i);
                        if (th) {
                            rsn = th[1].trim();
                            txt = clientTidy(txt.replace(th[0], ''));
                        }
                        if (!txt && rsn) { txt = rsn; rsn = ''; }
                        return { text: txt, reasoning: rsn };
                    };

                    const clientBadReply = function (txt) {
                        const v = String(txt || '');
                        if (/لم يتم العثور على رد|استجابة كاملة|AiError|neurons|Workers Paid|daily free allocation|"code"\s*:\s*4006|PayloadTooLargeError|request entity too large/i.test(v)) return true;
                        if (v.length > 400) return false;
                        return /فشل الاتصال|انقطع الاتصال|cURL Error|Operation timed out|Connection timed out|HTTP Code:\s*0|502 Bad Gateway|503 Service/i.test(v);
                    };

                    const applyGradioDiff = function (state, diff) {
                        if (!Array.isArray(diff) || !diff.length || !Array.isArray(diff[0]) ||
                            typeof diff[0][0] !== 'string' ||
                            ['append', 'replace', 'add', 'delete'].indexOf(diff[0][0]) === -1) {
                            return diff === undefined ? null : JSON.parse(JSON.stringify(diff));
                        }
                        let out = state === undefined || state === null ? null : JSON.parse(JSON.stringify(state));
                        for (let i = 0; i < diff.length; i++) {
                            const op = diff[i];
                            if (!Array.isArray(op)) continue;
                            const act = op[0];
                            const p = op[1];
                            const val = op[2];
                            if (!Array.isArray(p) || p.length === 0) {
                                if (act === 'append') {
                                    if (typeof out === 'string') out += String(val || '');
                                    else if (Array.isArray(out)) out.push(val);
                                } else if (act === 'replace' || act === 'add') {
                                    out = val;
                                }
                                continue;
                            }
                            let cur = out;
                            for (let j = 0; j < p.length - 1; j++) {
                                if (cur == null) break;
                                cur = cur[p[j]];
                            }
                            if (cur == null) continue;
                            const k = p[p.length - 1];
                            if (act === 'append') {
                                if (typeof cur[k] === 'string') cur[k] += String(val || '');
                                else if (Array.isArray(cur[k])) cur[k].push(val);
                            } else if (act === 'replace' || act === 'add') {
                                cur[k] = val;
                            } else if (act === 'delete') {
                                if (Array.isArray(cur)) cur.splice(k, 1);
                                else delete cur[k];
                            }
                        }
                        return out;
                    };

                    const uploadClientImages = async function (base, imgs, sig) {
                        if (!Array.isArray(imgs) || !imgs.length) return [];
                        const fd = new FormData();
                        const metas = [];
                        for (let i = 0; i < imgs.length && i < 5; i++) {
                            const im = imgs[i];
                            if (!im || !im.dataUrl) continue;
                            const str = String(im.dataUrl);
                            const comma = str.indexOf(',');
                            const head = comma >= 0 ? str.slice(0, comma) : '';
                            const b64 = comma >= 0 ? str.slice(comma + 1) : str;
                            const mm = head.match(/data:([^;]+)/i);
                            const mime = (mm && mm[1]) || im.mime || 'image/png';
                            const bin = atob(b64);
                            const bytes = new Uint8Array(bin.length);
                            for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
                            const nm = im.name || ('image-' + (i + 1) + '.png');
                            fd.append('files', new Blob([bytes], { type: mime }), nm);
                            metas.push({ name: nm, mime: mime });
                        }
                        if (!metas.length) return [];
                        const up = await fetch(base + '/gradio_api/upload', {
                            method: 'POST',
                            credentials: 'omit',
                            signal: sig,
                            body: fd
                        });
                        if (!up.ok) return [];
                        const paths = await up.json();
                        if (!Array.isArray(paths)) return [];
                        return paths.map(function (p, idx) {
                            return {
                                path: p,
                                orig_name: (metas[idx] && metas[idx].name) || ('image-' + (idx + 1) + '.png'),
                                mime_type: (metas[idx] && metas[idx].mime) || 'image/png',
                                meta: { _type: 'gradio.FileData' }
                            };
                        });
                    };

                    const directClientAsk = async function () {
                        const arRe = /[\u0600-\u06FF]/;
                        const lastU = cleanMessages.filter(function (m) { return m && m.role !== 'assistant' && m.content; }).pop();
                        const uTxt = lastU ? String(lastU.content) : '';
